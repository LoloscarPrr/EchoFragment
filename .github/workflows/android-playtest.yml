name: Android Playtest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-playtest.yml"

env:
  GODOT_VERSION: "4.3"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot CI
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          test -f /root/debug.keystore
          test -f ~/.config/godot/editor_settings-4.3.tres

      - name: Validate project
        run: |
          godot --headless --path . --editor --quit

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android Playtest" build/EchoFragment-0.11.2.apk
          test -s build/EchoFragment-0.11.2.apk
          ls -lh build/EchoFragment-0.11.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoFragment-0.11.2-APK
          path: build/EchoFragment-0.11.2.apk
          if-no-files-found: error
          retention-days: 30
