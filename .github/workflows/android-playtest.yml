name: Android Playtest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-playtest.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Install Godot Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Restore playtest signing key
        uses: actions/cache@v4
        with:
          path: ~/.echofragment-signing
          key: echofragment-playtest-signing-v1

      - name: Create playtest signing key if needed
        run: |
          mkdir -p "$HOME/.echofragment-signing"
          if [ ! -f "$HOME/.echofragment-signing/playtest.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.echofragment-signing/playtest.keystore" \
              -storepass echofragmentplaytest \
              -keypass echofragmentplaytest \
              -alias echofragment \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=EchoFragment Playtest, OU=Internal, O=EchoFragment, C=CL"
          fi

      - name: Import project
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.echofragment-signing/playtest.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: echofragment
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: echofragmentplaytest
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android Playtest" build/EchoFragment-0.10.1.apk
          test -f build/EchoFragment-0.10.1.apk
          ls -lh build/EchoFragment-0.10.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoFragment-0.10.1-APK
          path: build/EchoFragment-0.10.1.apk
          if-no-files-found: error
          retention-days: 30
