name: Android Playtest APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/visual-safe-weapon-combat-v050, fix/ruinas-del-eco-tiling-v052, feature/portador-weapon-visual-v053, feature/bow-single-button-approved-frames-v054]
    paths:
      - "scripts/**"
      - "assets/player/portador_bow_v054/**"
      - "scenes/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-playtest.yml"

env:
  GODOT_VERSION: "4.3"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot CI
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          test -f /root/debug.keystore
          test -f ~/.config/godot/editor_settings-4.3.tres

      - name: Verify both approved 3×3 bow sprite atlases exist
        run: |
          test -s assets/player/portador_bow_v054/combo.png
          test -s assets/player/portador_bow_v054/charged.png
          file assets/player/portador_bow_v054/*.png
          # Do not publish an APK with the old fallback art.
          python3 - <<'PY'
          import struct
          for name in ("combo", "charged"):
              p = f"assets/player/portador_bow_v054/{name}.png"
              with open(p, "rb") as f:
                  head = f.read(24)
              assert head[:8] == b"\\x89PNG\\r\\n\\x1a\\n", p
              assert struct.unpack(">II", head[16:24]) == (1344, 1344), p
          print("Both approved 9-cell bow atlases present")
          PY

      - name: Validate project
        run: |
          godot --headless --path . --editor --quit

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android Playtest" build/EchoFragment-0.5.4.apk
          test -s build/EchoFragment-0.5.4.apk
          ls -lh build/EchoFragment-0.5.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoFragment-0.5.4-APK
          path: build/EchoFragment-0.5.4.apk
          if-no-files-found: error
          retention-days: 30
