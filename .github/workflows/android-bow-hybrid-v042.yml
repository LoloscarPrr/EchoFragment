name: Android EchoFragment v0.4.2 - Crowd and Charge

on:
  push:
    branches: [feature/bow-combat-v042]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "tests/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-bow-hybrid-v042.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rig-preview:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout corrected Portador and mockup environment
        uses: actions/checkout@v4

      - name: Configure Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          test -f /root/debug.keystore

      - name: Import art and validate all scripts
        run: |
          godot --headless --path . --editor --quit

      - name: Verify actual textured rig and player bridge
        run: |
          godot --headless --path . --script res://tests/portador_pose_visual_test.gd
          godot --headless --path . --script res://tests/mockup_integration_test.gd
          godot --headless --path . --script res://tests/tajo_del_eco_timeline_test.gd
          godot --headless --path . --script res://tests/rig_player_bridge_test.gd
          godot --headless --path . --script res://tests/bow_combo_test.gd
          godot --headless --path . --script res://tests/bow_crowd_charge_test.gd

      - name: Export Android APK v0.4.2
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android Playtest" build/EchoFragment-0.4.2.apk
          test -s build/EchoFragment-0.4.2.apk
          ls -lh build/EchoFragment-0.4.2.apk

      - name: Upload APK for Android testing
        uses: actions/upload-artifact@v4
        with:
          name: EchoFragment-0.4.2-APK
          path: build/EchoFragment-0.4.2.apk
          if-no-files-found: error
          retention-days: 30

  publish-direct-apk:
    needs: build-rig-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get signed APK without artifact ZIP
        uses: actions/download-artifact@v4
        with:
          name: EchoFragment-0.4.2-APK
          path: dist
      - name: Publish direct APK as experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s dist/EchoFragment-0.4.2.apk
          TAG="bow-hybrid-preview-v0.4.2"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/EchoFragment-0.4.2.apk --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG" dist/EchoFragment-0.4.2.apk \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "EchoFragment v0.4.2 - Flecha, patada grupal y carga" \
              --notes "APK v0.4.2: conserva Portador articulado y multitouch; flecha y patada con multiples impactos, retroceso duradero y disparo cargado manteniendo ataque. Animaciones de arco aun provisionales." \
              --prerelease
          fi
