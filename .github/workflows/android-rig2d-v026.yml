name: Android EchoFragment v0.4.0

on:
  push:
    branches: [feature/portador-rig2d-prototype]
    paths: ['.github/workflows/android-rig2d-v026.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rig-preview:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout corrected Portador and mockup environment
        uses: actions/checkout@v4

      - name: Configure Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          test -f /root/debug.keystore

      - name: Import art and validate all scripts
        run: |
          godot --headless --path . --editor --quit

      - name: Verify actual textured rig and player bridge
        run: |
          godot --headless --path . --script res://tests/portador_pose_visual_test.gd
          godot --headless --path . --script res://tests/mockup_integration_test.gd
          godot --headless --path . --script res://tests/tajo_del_eco_timeline_test.gd
          godot --headless --path . --script res://tests/rig_player_bridge_test.gd

      - name: Export Android APK v0.4.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android Playtest" build/EchoFragment-0.4.0.apk
          test -s build/EchoFragment-0.4.0.apk
          ls -lh build/EchoFragment-0.4.0.apk

      - name: Upload APK for Android testing
        uses: actions/upload-artifact@v4
        with:
          name: EchoFragment-0.4.0-APK
          path: build/EchoFragment-0.4.0.apk
          if-no-files-found: error
          retention-days: 30

  publish-direct-apk:
    needs: build-rig-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get signed APK without artifact ZIP
        uses: actions/download-artifact@v4
        with:
          name: EchoFragment-0.4.0-APK
          path: dist
      - name: Publish direct APK as experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s dist/EchoFragment-0.4.0.apk
          TAG="rig2d-preview-v0.4.0"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/EchoFragment-0.4.0.apk --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG" dist/EchoFragment-0.4.0.apk \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "EchoFragment v0.4.0 - Portador corregido" \
              --notes "APK experimental v0.4.0: Portador corregido con 12 poses completas, escenario de ruinas del mockup, HUD y controles circulares. Animacion basica. Android arm64. Rama experimental." \
              --prerelease
          fi
