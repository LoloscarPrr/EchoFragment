name: Godot Check

on:
  push:
    branches: [main, feature/visual-safe-weapon-combat-v050]
  pull_request:
    branches: [main, feature/bow-combat-v042]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Validate project
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Test Tajo del Eco Phase 1.1 timing
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/tajo_del_eco_timeline_test.gd

      - name: Check bow_combo_test.gd
        run: |
          timeout 50s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/bow_combo_test.gd

      - name: Check bow_crowd_charge_test.gd
        run: |
          timeout 50s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/bow_crowd_charge_test.gd

      - name: Check weapon_skill_tree_test.gd
        run: |
          timeout 50s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/weapon_skill_tree_test.gd

      - name: Check weapon_actions_test.gd
        run: |
          timeout 50s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/weapon_actions_test.gd

      - name: Check portador_pose_visual_test.gd
        run: |
          timeout 50s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/portador_pose_visual_test.gd

      - name: Check mockup_integration_test.gd
        run: |
          timeout 50s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/mockup_integration_test.gd

      - name: Check rig_player_bridge_test.gd
        run: |
          timeout 50s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/rig_player_bridge_test.gd

      - name: Check visual_combat_regression_test.gd
        run: |
          timeout 50s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/visual_combat_regression_test.gd

      - name: Check weapon_actions_scene_test.gd
        run: |
          timeout 50s ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/weapon_actions_scene_test.gd
