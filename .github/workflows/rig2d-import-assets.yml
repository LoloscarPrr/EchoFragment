name: One-time Portador Art Import
on:
  push:
    branches: [feature/portador-rig2d-prototype]
    paths: ['.github/workflows/rig2d-import-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-actual-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download nine art assets from Canva (full-resolution first)
        run: |
          import urllib.request, pathlib, re, json, sys, struct
          assets=json.loads("[[\"portador_head_helmet.png\",\"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F67c7ebca-bc45-4f55-9bad-16125d259cb6/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAPGdbZoZxh1wyTHANtVpDbsMP0Wt9j3gULpl3IyRSvjN&exp=1793111002&osig=AAAAAAAAAAAAAAAAAAAAAO26DWj8B0B-oIMNplnvIAQM0Hyj8kZlAHzELCDxfQ0y&signer=media-rpc&token=AAIAAU0AJDY3YzdlYmNhLWJjNDUtNGY1NS05YmFkLTE2MTI1ZDI1OWNiNgAAAAABoX2-i5D1gqNvtGLo7o8QtCCyvK1V5T631OsNNnPciESZMAvhgg&x-canva-quality=thumbnail\",1024,1024],[\"portador_torso_upper.png\",\"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F4b55bffa-d499-4063-b3f7-144ef682420b/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAAc5FGwgve-yPphHtRPe2Y0UzNEWXOBbZZsy3R-PEeat&exp=1793108718&osig=AAAAAAAAAAAAAAAAAAAAADdqZr4MkNuKYvsUw3XSN0NWsNWLffYpxBnyWvDhvDsX&signer=media-rpc&token=AAIAAU0AJDRiNTViZmZhLWQ0OTktNDA2My1iM2Y3LTE0NGVmNjgyNDIwYgAAAAABoX2bsbCvWPfOw6LlDpaFTt8Y04u5tX282ITJ7hjr6i6_HEpS_Q&x-canva-quality=thumbnail\",1024,1024],[\"portador_pelvis_waist.png\",\"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Ff359b8b9-799b-4707-8f3c-c03945f23c0c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALFKaVW3ZsyUTn8oM8N_sy37ArV_H8YEYCjdNn7OjVkw&exp=1793109032&osig=AAAAAAAAAAAAAAAAAAAAAI_SOVHOsv_aP6c2nPSFnEcN88JVF3TnJROEYB8Adix0&signer=media-rpc&token=AAIAAU0AJGYzNTliOGI5LTc5OWItNDcwNy04ZjNjLWMwMzk0NWYyM2MwYwAAAAABoX2gfEC37ZTarXlepo8Ox5ysKi1lf5Ktneu2hGzuH9_Jfsk_Fg&x-canva-quality=thumbnail\",1024,1024],[\"portador_arm_R.png\",\"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F07986162-5d32-40c5-b897-364a58d87bdf/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAFsREJr7ZPWJJuU7bvLLdjqrSkzr0L6AP1YGD-JYbi6y&exp=1793110360&osig=AAAAAAAAAAAAAAAAAAAAAINDkgnJ5i4sw4ymTpwtGnmArJQ7_mgT6WOVHfLDvVb4&signer=media-rpc&token=AAIAAU0AJDA3OTg2MTYyLTVkMzItNDBjNS1iODk3LTM2NGE1OGQ4N2JkZgAAAAABoX20v8ALeDGwZzTxQDuKUNV8co-7M5ZQ4Y6M1_7Sp-Wf41SU3A&x-canva-quality=thumbnail\",1024,1536],[\"portador_arm_L.png\",\"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F474b887f-d612-4b1d-8a08-025721d33cdf/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAAnQ1NJlBlvgycBZSWg-6w2g-6cRvbbQh1CpneSuepVf&exp=1793110708&osig=AAAAAAAAAAAAAAAAAAAAANHjp2AZcg4Q0BY5_E4ChU1Sv7nWJ1o0Cj0IIOwkm_1u&signer=media-rpc&token=AAIAAU0AJDQ3NGI4ODdmLWQ2MTItNGIxZC04YTA4LTAyNTcyMWQzM2NkZgAAAAABoX26DyBmecNejM2IBBONFNraWSbF44xVxcSG-BM5HZd-gum32Q&x-canva-quality=thumbnail\",1024,1536],[\"portador_leg_R.png\",\"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fe70e51f6-9f02-4852-9d91-6d49ac445bb1/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAIFQmpoG3IO2SjMPVBsIJ3EQTVLX4MbalK0Ea_6L--6D&exp=1793110952&osig=AAAAAAAAAAAAAAAAAAAAALBE6WqEZv8V3Zwulwwjs62cwzBhPw1kLnkyE9m70nlH&signer=media-rpc&token=AAIAAU0AJGU3MGU1MWY2LTlmMDItNDg1Mi05ZDkxLTZkNDlhYzQ0NWJiMQAAAAABoX29yEBEhEIF-Hzv51jJNIzwbj2KXORXDIOFLoxgEkYOA-c6fQ&x-canva-quality=thumbnail\",1024,1536],[\"portador_leg_L.png\",\"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F22f5fd41-37b7-4e0e-bb48-063d43d3b658/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAACNwo1M5e7DLLCEUvmo4BmaME0ZqB4Vb_raa2iEjIUuB&exp=1793109907&osig=AAAAAAAAAAAAAAAAAAAAAD0-8xu0btCbSwjivt1Dg6xzNlayWYsg82Y_w7mcqyu2&signer=media-rpc&token=AAIAAU0AJDIyZjVmZDQxLTM3YjctNGUwZS1iYjQ4LTA2M2Q0M2QzYjY1OAAAAAABoX2t1jhWO7JlrclBbxtVdDkmpfki-2aZgs4xbMVO133-W-FuVA&x-canva-quality=thumbnail\",1024,1536],[\"portador_cape.png\",\"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F03f7e73d-12b6-4f16-876c-f5278123022f/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAE_-_GL1Jkbc88aDEeOWeNAc99hpIdExuGkxScWtLG4y&exp=1793109945&osig=AAAAAAAAAAAAAAAAAAAAALnFx2q6IvlUqVgXxg6ZefjOh-aH4ttPhLs6HBtwi5ci&signer=media-rpc&token=AAIAAU0AJDAzZjdlNzNkLTEyYjYtNGYxNi04NzZjLWY1Mjc4MTIzMDIyZgAAAAABoX2uaqjuFE2uLuNskWM4I6IL20-bbgA2X9GF7aig9tK_LUL0OQ&x-canva-quality=thumbnail\",1024,1536],[\"portador_sword.png\",\"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fc415441b-780b-4c4f-8aa5-2e02dc01a6fb/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAPe9mGiyYcU-QtI_mIhzxMKsDP8ZS9yHyypIz5CFnqQA&exp=1793111710&osig=AAAAAAAAAAAAAAAAAAAAAMef3EzWZcGXuZRpxaUNFTNRyzjEAcIvANHVI-d5s921&signer=media-rpc&token=AAIAAU0AJGM0MTU0NDFiLTc4MGItNGM0Zi04YWE1LTJlMDJkYzAxYTZmYgAAAAABoX3JWTA0PkcRmh5m-EMDEtG14-5EufIn4M98ESfUTPqrbxPADg&x-canva-quality=thumbnail\",1024,1536]]")
          folder=pathlib.Path("assets/player/portador_rig2d/v02")
          folder.mkdir(parents=True,exist_ok=True)
          report=[]
          for name,url,width,height in assets:
              enhanced=re.sub(r'/height:\d+/',f'/height:{height}/',url)
              enhanced=re.sub(r'/width:\d+(?=\?)',f'/width:{width}',enhanced)
              candidates=[enhanced,url] if enhanced!=url else [url]
              result=None
              for uri in candidates:
                  try:
                      req=urllib.request.Request(uri,headers={"User-Agent":"EchoFragment CI image import"})
                      payload=urllib.request.urlopen(req,timeout=45).read()
                      if payload[:8]!=bytes([137,80,78,71,13,10,26,10]): continue
                      w,h=struct.unpack(">II",payload[16:24])
                      if w<64 or h<64:continue
                      result=(payload,w,h,uri==enhanced)
                      break
                  except Exception as e: print("Image source fallback:",name,type(e).__name__)
              if result is None:
                  print("FAILED:",name)
                  sys.exit(1)
              target=folder / name
              target.write_bytes(result[0])
              print("IMAGE",name,result[1],"x",result[2],len(result[0]),"bytes")
              report.append({"file":name,"width":result[1],"height":result[2],"source":"high-res" if result[3] else "Canva thumbnail","preview_quality":result[1]<300 or result[2]<300})
          (folder/"canva_ci_import_report.json").write_text(json.dumps(report,indent=2)+"\n")
          
      - name: Commit images to the experimental branch
        run: |
          git config user.name "EchoFragment Art Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player/portador_rig2d/v02/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "assets(rig2d): add nine actual Portador textures"
            git push origin HEAD:feature/portador-rig2d-prototype
          fi
